name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]

      - name: Run test suite
        run: |
          pytest -q

  build-and-release:
    name: Build Artifacts & Publish GitHub Release
    needs: validate-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Git tag matches package version in pyproject.toml
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Git Tag Version: $TAG_VERSION"
          echo "Package Version: $PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version '$TAG_VERSION' does not match pyproject.toml version '$PACKAGE_VERSION'"
            exit 1
          fi

      - name: Install build and packaging dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install build twine

      - name: Build sdist and wheel
        run: |
          rm -rf dist build
          python -m build

      - name: Validate distribution metadata
        run: |
          twine check --strict dist/*

      - name: Test installation in clean isolated environment outside repository
        run: |
          python -m venv /tmp/release_test_env
          /tmp/release_test_env/bin/pip install --no-index --find-links=dist connscope
          cd /tmp
          /tmp/release_test_env/bin/connscope --version
          /tmp/release_test_env/bin/connscope --help
          /tmp/release_test_env/bin/connscope catalog check
          /tmp/release_test_env/bin/connscope probe list
          /tmp/release_test_env/bin/connscope matrix preview --engine xray --profile vless_tcp_none
          rm -rf /tmp/release_test_env

      - name: Package documentation archive
        run: |
          tar -czf "dist/connscope-docs-${GITHUB_REF_NAME}.tar.gz" docs README.md LICENSE

      - name: Generate SHA-256 checksums manifest
        run: |
          cd dist
          rm -f checksums.sha256
          sha256sum $(ls -1 | grep -v '^checksums\.sha256$') > checksums.sha256
          if grep -q "checksums.sha256" checksums.sha256; then
            echo "Error: checksums.sha256 must not contain itself"
            exit 1
          fi
          cat checksums.sha256

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Error: Release $GITHUB_REF_NAME is already published. Modifying an existing published release is disallowed. Explicit maintainer action is required." >&2
              exit 1
            fi
            EXISTING_ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            if [ -n "$EXISTING_ASSETS" ]; then
              for asset in $EXISTING_ASSETS; do
                if [ ! -f "dist/$asset" ]; then
                  echo "Error: Draft release $GITHUB_REF_NAME contains unexpected asset '$asset'. Explicit maintainer action is required." >&2
                  exit 1
                fi
              done
            fi
            echo "Release $GITHUB_REF_NAME exists as draft. Replacing expected assets..."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            echo "Creating draft release $GITHUB_REF_NAME..."
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "ConnScope $GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease=false
            gh release upload "$GITHUB_REF_NAME" dist/*
          fi

          echo "Verifying uploaded release assets..."
          VERIFY_DIR=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --dir "$VERIFY_DIR" --clobber

          if ! cmp -s "$VERIFY_DIR/checksums.sha256" "dist/checksums.sha256"; then
            echo "Error: Downloaded checksums.sha256 does not match dist/checksums.sha256 byte-for-byte" >&2
            rm -rf "$VERIFY_DIR"
            exit 1
          fi

          EXPECTED_LIST=$(cd dist && ls -1 | sort)
          DOWNLOADED_LIST=$(cd "$VERIFY_DIR" && ls -1 | sort)
          if [ "$EXPECTED_LIST" != "$DOWNLOADED_LIST" ]; then
            echo "Error: Mismatch between expected and downloaded release assets." >&2
            echo "Expected:" >&2
            echo "$EXPECTED_LIST" >&2
            echo "Downloaded:" >&2
            echo "$DOWNLOADED_LIST" >&2
            rm -rf "$VERIFY_DIR"
            exit 1
          fi

          (cd "$VERIFY_DIR" && sha256sum --check checksums.sha256)
          rm -rf "$VERIFY_DIR"

          echo "Payload verified. Publishing release $GITHUB_REF_NAME..."
          gh release edit "$GITHUB_REF_NAME" --draft=false
